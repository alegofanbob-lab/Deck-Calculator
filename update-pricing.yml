name: Update lumber pricing

on:
  schedule:
    # Runs at 06:00 UTC on the 2nd of every month (FRED's monthly data
    # typically posts a day or two into the new month, so waiting until
    # the 2nd avoids grabbing a stale/incomplete observation on the 1st)
    - cron: '0 6 2 * *'
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab too

jobs:
  update-pricing:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch latest lumber pricing
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python update_pricing.py

      - name: Commit updated pricing.json
        run: |
          git config user.name "pricing-bot"
          git config user.email "actions@github.com"
          git add pricing.json
          git diff --staged --quiet || git commit -m "Monthly lumber pricing update"
          git push
