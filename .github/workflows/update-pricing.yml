name: Update lumber pricing

on:
  schedule:
    - cron: '0 6 2 * *'
  workflow_dispatch: {}

jobs:
  update-pricing:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch latest lumber pricing
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python update_pricing.py

      - name: Commit updated pricing.json
        run: |
          git config user.name "pricing-bot"
          git config user.email "actions@github.com"
          git add pricing.json
          git diff --staged --quiet || git commit -m "Monthly lumber pricing update"
          git push
